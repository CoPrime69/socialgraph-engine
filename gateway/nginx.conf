# API gateway + static file server (contracts §2).
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 64k;

  log_format json escape=json '{"ts":"$time_iso8601","service":"gateway","method":"$request_method",'
                              '"path":"$uri","status":$status,"duration_ms":$request_time,'
                              '"upstream":"$upstream_addr","request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml text/vnd.graphviz;
  gzip_min_length 1024;

  # Docker's embedded DNS; re-resolve so restarted containers are found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Brute-force protection in front of the identity service's own per-IP/per-handle limits.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  upstream identity  { server identity:8081;  keepalive 16; }
  upstream graph     { server graph:8082;     keepalive 16; }
  upstream analytics { server analytics:8083; keepalive 16; }
  upstream content   { server content:8084;   keepalive 16; }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # nginx drops inherited add_header directives in any location that sets its own, so the
    # security headers live in one file included everywhere headers are added.
    include /etc/nginx/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location = /gateway/health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }

    # Internal service-to-service endpoints are never reachable from outside.
    location /internal/ { default_type application/json; return 404 '{"error":{"code":"not_found","message":"Not found"}}'; }

    location ~ ^/api/v1/auth/(login|register)$ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://identity;
    }
    location /api/v1/auth/ { proxy_pass http://identity; }

    location /api/v1/analytics/          { proxy_pass http://analytics; }
    location = /api/v1/paths             { proxy_pass http://analytics; }
    location = /api/v1/me/recommendations { proxy_pass http://analytics; }
    location ~ ^/api/v1/users/[0-9]+/metrics$ { proxy_pass http://analytics; }

    location ~ ^/api/v1/users/[0-9]+/activity$ { proxy_pass http://content; }
    location = /api/v1/tags    { proxy_pass http://content; }
    location /api/v1/questions { proxy_pass http://content; }

    location /api/v1/users          { proxy_pass http://graph; }
    location = /api/v1/me/profile   { proxy_pass http://graph; }
    location /api/v1/me/connections { proxy_pass http://graph; }
    location /api/v1/meta/          { proxy_pass http://graph; }

    location /api/ { default_type application/json; return 404 '{"error":{"code":"not_found","message":"Unknown API route"}}'; }

    location /assets/ { include /etc/nginx/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri /index.html; }
  }
}
